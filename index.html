<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión Biomédica CENDIATRA</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fa;
}

header{
background:#0b2f52;
color:white;
padding:15px;
}

.container{
padding:20px;
}

.card{
background:white;
border-radius:10px;
padding:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.kpi{
text-align:center;
}

.kpi h2{
margin:0;
font-size:32px;
color:#0b2f52;
}

.kpi p{
margin:5px 0 0;
font-size:12px;
}

button{
background:#0b2f52;
color:white;
border:none;
border-radius:5px;
padding:10px 15px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:8px;
font-size:12px;
}

th{
background:#eef4f8;
}

</style>

</head>

<body>

<header>

<h1>Gestión Biomédica CENDIATRA SAS</h1>

</header>

<div class="container">

<div class="grid">

<div class="card kpi">
<h2 id="totalEquipos">0</h2>
<p>Total Equipos</p>
</div>

<div class="card kpi">
<h2 id="vencidos">0</h2>
<p>Mantenimientos Vencidos</p>
</div>

<div class="card kpi">
<h2 id="calibraciones">0</h2>
<p>Calibraciones Vencidas</p>
</div>

<div class="card kpi">
<h2 id="sedes">0</h2>
<p>Sedes</p>
</div>

</div>

<div class="card">

<h2>Inventario Biomédico</h2>

<button onclick="nuevoEquipo()">
Agregar Equipo
</button>

<br><br>

<table>

<thead>

<tr>

<th>REF-B</th>
<th>Equipo</th>
<th>Marca</th>
<th>Modelo</th>
<th>Serie</th>
<th>Sede</th>

</tr>

</thead>

<tbody id="tablaEquipos">

</tbody>

</table>

</div>

</div>

<script>

let equipos=[

{
ref:"90",
equipo:"TENSIOMETRO DIGITAL",
marca:"OMRON",
modelo:"HEM-7120",
serie:"20160603871LG",
sede:"NORTE 106"
},

{
ref:"91",
equipo:"TENSIOMETRO DIGITAL",
marca:"OMRON",
modelo:"HEM-7120",
serie:"20160601890LG",
sede:"NORTE 106"
}

];

function render(){

document.getElementById(
"totalEquipos"
).innerText=equipos.length;

document.getElementById(
"vencidos"
).innerText="0";

document.getElementById(
"calibraciones"
).innerText="0";

const sedes=[
...new Set(
equipos.map(e=>e.sede)
)
];

document.getElementById(
"sedes"
).innerText=sedes.length;

document.getElementById(
"tablaEquipos"
).innerHTML=

equipos.map(e=>`

<tr>

<td>${e.ref}</td>
<td>${e.equipo}</td>
<td>${e.marca}</td>
<td>${e.modelo}</td>
<td>${e.serie}</td>
<td>${e.sede}</td>

</tr>

`).join("");

}

function nuevoEquipo(){

let ref=
prompt("REF-B");

if(!ref) return;

let equipo=
prompt("Equipo");

let marca=
prompt("Marca");

let modelo=
prompt("Modelo");

let serie=
prompt("Serie");

let sede=
prompt("Sede");

equipos.push({

ref,
equipo,
marca,
modelo,
serie,
sede

});

render();

}

render();

</script>

</body>

</html>
